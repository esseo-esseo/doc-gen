<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>템플릿 · 17 Image Hero Closing — 큰 이미지 + 핵심 메시지</title>
  <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body>
  <div id="deck">
    <div class="slide active">
      <div class="sh">
        <div class="num">CLOSING</div>
        <h2>핵심 시사점 <span>한 줄 정리</span></h2>
      </div>
      <div class="two" style="margin-top:1.5vw;align-items:stretch;">
        <div class="img-ph hero" style="min-height:36vh;">
          <div class="ph-ico">🖼️</div>
          <div class="ph-txt">image</div>
          <div class="ph-sub">비전 키 비주얼 — 16:9 권장</div>
        </div>
        <div style="display:flex;flex-direction:column;justify-content:center;">
          <div class="hlbox" style="margin-bottom:.8vw;">
            <h3>🎯 핵심 사실 3가지</h3>
            <p>① 시장은 정착 단계 — 제도·수가 안정<br>② 임상·운영 성과는 명확하게 검증됨<br>③ 인지율·이행률은 여전히 빈 공간 — 우리의 진입점</p>
          </div>
          <div class="card gold">
            <h3>💡 우리의 전략적 포지션</h3>
            <p style="font-size:.85vw;">제도가 보장하는 <strong>운영자 보상 구조</strong>는 충분히 안정적 — 우리가 채울 영역은
              <strong>고객 발굴·이행률 견인·자동화</strong>. 제도가 만든 토양 위에 소프트웨어로 마지막 마일을 잇는다.</p>
          </div>
        </div>
      </div>
      <div
        style="margin-top:1.2vw;padding:1vw 1.2vw;text-align:center;background:linear-gradient(90deg,rgba(79,142,247,.15),rgba(124,58,237,.15));border:1px solid rgba(79,142,247,.35);border-radius:.8vw;">
        <span style="font-size:1.1vw;font-weight:800;color:#1d4ed8;letter-spacing:1px;">제도가 만든 토양 · 소프트웨어가 잇는 마지막 마일</span>
      </div>
      <div class="author-foot">작성자 · 웰체크팀 서은상</div>
    </div>
  </div>

  <div id="top-actions">
    <button id="theme-toggle" onclick="toggleTheme()" title="다크/라이트 전환" aria-label="테마 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.05" y2="16.95"/><line x1="16.95" y1="7.05" x2="19.07" y2="4.93"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button id="pdf-save" onclick="savePDF()" title="PDF 저장" aria-label="PDF 저장">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>

  <script src="../_shared/deck.js"></script>
</body>
</html>
